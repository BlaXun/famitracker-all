name: Windows build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }} (Win32)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild FamiTracker.sln /m /nologo /v:minimal /p:Configuration=${{ matrix.configuration }} /p:Platform=x86 "-flp:LogFile=msbuild.log;Verbosity=minimal"

      - name: Upload FamiTracker.exe
        uses: actions/upload-artifact@v4
        with:
          name: FamiTracker-${{ matrix.configuration }}-Win32
          path: |
            build/Win32/${{ matrix.configuration }}/FamiTracker.exe
            build/Win32/${{ matrix.configuration }}/FamiTracker.pdb
          if-no-files-found: error

      - name: Build and test the transcription engine
        if: matrix.configuration == 'Release'
        shell: bash
        run: |
          cmake -S Source/Transcribe -B build/transcribe -A Win32 2>&1 | tee transcribe-build.log
          cmake --build build/transcribe --config Release 2>&1 | tee -a transcribe-build.log
          ctest --test-dir build/transcribe -C Release --output-on-failure 2>&1 | tee transcribe-test.log

      - name: Build and test the Claude Code connection's core
        if: matrix.configuration == 'Release'
        shell: bash
        run: |
          cmake -S Source/Api -B build/api -A Win32 2>&1 | tee api-build.log
          cmake --build build/api --config Release 2>&1 | tee -a api-build.log
          ctest --test-dir build/api -C Release --output-on-failure 2>&1 | tee api-test.log

      - name: Build and test the NSF importer
        if: matrix.configuration == 'Release'
        shell: bash
        run: |
          cmake -S Source/Nsf -B build/nsf -A Win32 2>&1 | tee nsf-build.log
          cmake --build build/nsf --config Release 2>&1 | tee -a nsf-build.log
          ctest --test-dir build/nsf -C Release --output-on-failure 2>&1 | tee nsf-test.log

      - name: Upload wav2ftm.exe
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: wav2ftm-Win32
          path: build/transcribe/Release/wav2ftm.exe
          if-no-files-found: error

      # Claude Code in WSL starts it to reach FamiTracker (Source/Api/Bridge.h)
      - name: Upload famitracker-mcp.exe
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: famitracker-mcp-Win32
          path: build/api/Release/famitracker-mcp.exe
          if-no-files-found: error

      # Turns an NSF's tracks into a FamiTracker text module, or studies them (Source/Nsf)
      - name: Upload nsf2ftm.exe
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: nsf2ftm-Win32
          path: build/nsf/Release/nsf2ftm.exe
          if-no-files-found: error

      # Publishes compiler diagnostics, toolchain details and facts about the built exe
      # as a check run named "Build report (<config> Win32)", readable through the
      # GitHub checks API (gh api repos/<owner>/<repo>/commits/<sha>/check-runs).
      - name: Publish build report
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          $exe = "build/Win32/$env:CONFIGURATION/FamiTracker.exe"
          $diag = @()
          $logs = @('msbuild.log', 'transcribe-build.log', 'api-build.log', 'nsf-build.log') | Where-Object { Test-Path $_ }
          if ($logs) {
            $diag = Get-Content $logs |
              Where-Object { $_ -match ':\s+(fatal )?(error|warning) [A-Z]+[0-9]+' } |
              ForEach-Object { (($_ -replace '^\s*\d+>', '') -replace '\s+\[[^\]]+\]\s*$', '').Trim() } |
              Sort-Object -Unique
          }
          $errors = @($diag | Where-Object { $_ -match ':\s+(fatal )?error ' }).Count
          $warnings = @($diag | Where-Object { $_ -match ':\s+warning ' }).Count
          $byCode = $diag | ForEach-Object { if ($_ -match ':\s+(?:fatal )?(?:error|warning) ([A-Z]+[0-9]+)') { $Matches[1] } } |
            Group-Object | Sort-Object Count -Descending | ForEach-Object { "$($_.Count) x $($_.Name)" }

          $info = @()
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $info += "Visual Studio: $(& $vswhere -latest -products * -property displayName) $(& $vswhere -latest -products * -property installationVersion)"
          $tools = Get-ChildItem "$vs\VC\Tools\MSVC" | Sort-Object Name | Select-Object -Last 1
          $info += "MSVC tools: $($tools.Name)"
          if (Test-Path $exe) {
            $info += "FamiTracker.exe: $((Get-Item $exe).Length) bytes"
            $dumpbin = Join-Path $tools.FullName 'bin\Hostx64\x86\dumpbin.exe'
            if (Test-Path $dumpbin) {
              $deps = & $dumpbin /nologo /dependents $exe | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
              $info += "DLL dependencies: $($deps -join ', ')"
              $info += & $dumpbin /nologo /headers $exe | Where-Object { $_ -match ' machine | subsystem' } | ForEach-Object { $_.Trim() }
            }
            $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1
            if ($mt) {
              & $mt.FullName -nologo "-inputresource:$exe;#1" -out:embedded.manifest | Out-Null
              if (Test-Path embedded.manifest) { $info += 'Embedded manifest:'; $info += Get-Content embedded.manifest }
            }
          } else {
            $info += 'FamiTracker.exe: missing'
          }

          $tests = @()
          if (Test-Path transcribe-test.log) {
            $tests = @(Get-Content transcribe-test.log | Where-Object { $_ -match 'FAIL|checks,|tests passed|tests failed|end-to-end' })
          }
          if (Test-Path api-test.log) {
            $tests += @(Get-Content api-test.log | Where-Object { $_ -match 'FAIL|checks,|tests passed|tests failed' } | ForEach-Object { "Claude Code connection: $_" })
          }
          if (Test-Path nsf-test.log) {
            $tests += @(Get-Content nsf-test.log | Where-Object { $_ -match 'FAIL|checks,|tests passed|tests failed' } | ForEach-Object { "NSF importer: $_" })
          }
          $text = @('## Toolchain and binary') + $info + @('', '## Transcription engine tests') + $tests + @('', '## Diagnostics by code') + $byCode + @('', '## Unique diagnostics') + $diag
          $text = $text -join "`n"
          if ($text.Length -gt 60000) { $text = $text.Substring(0, 60000) + "`n... (truncated)" }
          $body = @{
            name       = "Build report ($env:CONFIGURATION Win32)"
            head_sha   = $env:GITHUB_SHA
            status     = 'completed'
            conclusion = 'neutral'
            output     = @{
              title   = "$errors errors, $warnings warnings"
              summary = "MSBuild diagnostics and binary details for $env:CONFIGURATION Win32."
              text    = $text
            }
          } | ConvertTo-Json -Depth 5
          $body | gh api "repos/$env:GITHUB_REPOSITORY/check-runs" --method POST --input - | Out-Null

  transcribe-linux:
    name: Transcription engine and clips (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S Source/Transcribe -B build/transcribe -DCMAKE_BUILD_TYPE=Release
          cmake --build build/transcribe -j 4

      - name: Test
        run: ctest --test-dir build/transcribe --output-on-failure

      # The Claude Code connection's core: JSON, HTTP, MCP and the tools (Source/Api)
      - name: Claude Code connection tests
        run: |
          cmake -S Source/Api -B build/api -DCMAKE_BUILD_TYPE=Release
          cmake --build build/api -j 4
          ctest --test-dir build/api --output-on-failure

      # famitracker-mcp for Linux, linked statically against musl on Alpine so it
      # runs on any x86-64 Linux: stdio MCP clients on another computer reach
      # FamiTracker over the network with it (--host)
      - name: Build famitracker-mcp for Linux
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -c '
            apk add --no-cache g++ cmake make >/dev/null &&
            cmake -S Source/Api -B build/bridge-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS=-static &&
            cmake --build build/bridge-linux --target famitracker-mcp -j 4 &&
            strip -o famitracker-mcp-linux build/bridge-linux/famitracker-mcp'
          file famitracker-mcp-linux
          ./famitracker-mcp-linux --help | head -1

      - name: Upload famitracker-mcp-linux
        uses: actions/upload-artifact@v4
        with:
          name: famitracker-mcp-linux
          path: famitracker-mcp-linux
          if-no-files-found: error

      # The NSF importer: the 6502, the chips, the conversion and the studies (Source/Nsf)
      - name: NSF importer tests
        run: |
          cmake -S Source/Nsf -B build/nsf -DCMAKE_BUILD_TYPE=Release
          cmake --build build/nsf -j 4
          ctest --test-dir build/nsf --output-on-failure

      # The clip library and the piano roll's note editing against stand-ins for MFC (Source/Tests)
      - name: Clips and note editing tests
        run: |
          cmake -S Source/Tests -B build/tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tests -j 4
          ctest --test-dir build/tests --output-on-failure

  # After a green build on the main working branches (and on feat-* feature
  # branches, so their builds can be tried before they're merged), replace
  # that branch's rolling release (tag build-<branch>) with the new
  # FamiTracker.exe.
  publish:
    name: Publish latest build
    needs: [build, transcribe-linux]
    if: github.event_name == 'push' && (github.ref_name == 'beginner-friendly' || github.ref_name == 'next' || github.ref_name == 'recorder' || github.ref_name == 'api' || startsWith(github.ref_name, 'feat-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Download FamiTracker.exe
        uses: actions/download-artifact@v4
        with:
          name: FamiTracker-Release-Win32
          path: dist/FamiTracker

      - name: Download wav2ftm.exe
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: wav2ftm-Win32
          path: dist/wav2ftm

      - name: Download famitracker-mcp.exe (not built on api)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: famitracker-mcp-Win32
          path: dist/famitracker-mcp

      - name: Download nsf2ftm.exe
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nsf2ftm-Win32
          path: dist/nsf2ftm

      - name: Download famitracker-mcp-linux
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: famitracker-mcp-linux
          path: dist/famitracker-mcp-linux

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: bash .github/scripts/publish-build.sh
